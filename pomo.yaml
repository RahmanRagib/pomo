# yaml-language-server: $schema=https://raw.githubusercontent.com/RahmanRagib/pomo/main/config/schema.json
# pomo config file
# https://github.com/RahmanRagib/pomo

onSessionEnd: ask

asciiArt:
  enabled: true
  font: mono12
  color: "#5A56E0"

work:
  duration: 25m
  title: work session
  notification:
    enabled: true
    urgent: false
    title: work finished 🎉
    message: time to take a break
    # icon: ~/path/to/icon.png
  # then:
  #   - [spd-say, "Time to take a break"]
  # alarm-style beep (Windows): 3 parallel entries stack into a louder tone
  # then:
  #   - [powershell, -NoProfile, -Command, "1..6 | % { [console]::beep(1568,370); [console]::beep(1174,330) }"]
  #   - [powershell, -NoProfile, -Command, "1..6 | % { [console]::beep(1568,370); [console]::beep(1174,330) }"]
  #   - [powershell, -NoProfile, -Command, "1..6 | % { [console]::beep(1568,370); [console]::beep(1174,330) }"]

break:
  duration: 5m
  title: break session
  notification:
    enabled: true
    urgent: false
    title: break over 😴
    message: back to work!
    # icon: C:\Users\path\to\your\icon.png
  # then:
  #   - [spd-say, "Back to work!"]
  #   - [powershell, -NoProfile, -Command, "1..6 | % { [console]::beep(1568,370); [console]::beep(1174,330) }"]

longBreak:
  enabled: true
  after: 4
  duration: 20m
